[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zafather"
version = "0.4.2"
description = "Lightweight async Telegram bot framework | Yengil async Telegram bot framework | Легкий async-фреймворк для Telegram-ботов"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ismoilov299", email = "regnad299@gmail.com" }]
keywords = ["telegram", "bot", "framework", "async", "zafather", "telegram-bot"]
dependencies = ["aiohttp>=3.8"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

[project.optional-dependencies]
miniapp = ["cryptography>=41"]
userbot = []

[project.urls]
Homepage = "https://github.com/ismoilov299/zafather"
Repository = "https://github.com/ismoilov299/zafather"
Changelog = "https://github.com/ismoilov299/zafather/blob/main/CHANGELOG.md"
Issues = "https://github.com/ismoilov299/zafather/issues"

[project.scripts]
zafather = "zafather.__main__:main"

[tool.setuptools]
packages = ["zafather", "zafather.storage"]

[tool.setuptools.package-data]
zafather = ["py.typed"]
