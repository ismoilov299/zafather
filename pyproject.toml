[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zafather"
dynamic = ["version"]
description = "Lightweight async Telegram bot and userbot framework | Yengil async Telegram bot va userbot framework | Легкий async-фреймворк для Telegram-ботов и userbot"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ismoilov299", email = "regnad299@gmail.com" }]
keywords = ["telegram", "bot", "framework", "async", "zafather", "telegram-bot", "mtproto", "userbot"]
dependencies = ["aiohttp>=3.9"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

[project.optional-dependencies]
miniapp = ["cryptography>=42"]
userbot = ["cryptography>=42"]
redis = ["redis>=5"]
all = ["cryptography>=42", "redis>=5"]
dev = [
    "cryptography>=42",
    "redis>=5",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/ismoilov299/zafather"
Repository = "https://github.com/ismoilov299/zafather"
Documentation = "https://github.com/ismoilov299/zafather/tree/main/docs"
Changelog = "https://github.com/ismoilov299/zafather/blob/main/CHANGELOG.md"
Issues = "https://github.com/ismoilov299/zafather/issues"

[project.scripts]
zafather = "zafather.cli:main"

[tool.setuptools.dynamic]
version = { attr = "zafather.__version__" }

[tool.setuptools.packages.find]
include = ["zafather*"]

[tool.setuptools.package-data]
zafather = ["py.typed", "mtproto/tl/data/*.tl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "RET", "ASYNC"]
ignore = [
    # UZ: Docstring'lardagi kirill harflari. RU: Кириллица в docstring. EN: Cyrillic in docstrings.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["zafather", "tests"]

[tool.mypy]
python_version = "3.10"
packages = ["zafather"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
