name: PyPI'ga nashr

# UZ: v0.5.0 kabi tag qo'yilganda ishga tushadi.
# RU: Запускается при создании тега вида v0.5.0.
# EN: Runs when a tag such as v0.5.0 is pushed.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testlar (nashrdan oldin)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check zafather tests examples
          mypy
          pytest -q

      - name: Tag versiyasi zafather.__version__ ga mosligini tekshirish
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import zafather; print(zafather.__version__)")
          echo "tag=$TAG  package=$PKG"
          test "$TAG" = "$PKG"

      - name: Paketni yig'ish
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: PyPI'ga yuklash
        uses: pypa/gh-action-pypi-publish@release/v1
