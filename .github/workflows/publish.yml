name: PyPI'ga nashr

# v0.4.1 kabi tag qo'yilganda ishga tushadi.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testlar (nashrdan oldin)
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp cryptography
          python -m compileall -q zafather
          python test_zafather.py
          python test_miniapp.py
          python test_rich.py

      - name: Paketni yig'ish
        run: |
          pip install build
          python -m build

      - name: Tag versiyasi pyproject.toml ga mosligini tekshirish
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib,sys; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG  pyproject=$PKG"
          test "$TAG" = "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # Trusted Publishing (OIDC) — API token kerak emas
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: PyPI'ga yuklash
        uses: pypa/gh-action-pypi-publish@release/v1
