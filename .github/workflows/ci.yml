name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bog'liqliklar
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp cryptography

      - name: Kompilyatsiya tekshiruvi
        run: python -m compileall -q zafather

      - name: Yadro testlari
        run: python test_zafather.py

      - name: Mini App testlari
        run: python test_miniapp.py

      - name: Rich Messages testlari
        run: python test_rich.py
