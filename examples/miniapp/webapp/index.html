<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zafather Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    /* Telegram temasidan keladi — foydalanuvchi qanday tema tanlagan bo'lsa, shunga moslashadi */
    --bg: var(--tg-theme-bg-color, #17212b);
    --surface: var(--tg-theme-secondary-bg-color, #232e3c);
    --fg: var(--tg-theme-text-color, #f5f5f5);
    --hint: var(--tg-theme-hint-color, #7d8b99);
    --accent: var(--tg-theme-button-color, #2ea6ff);
    --on-accent: var(--tg-theme-button-text-color, #fff);
    --link: var(--tg-theme-link-color, #6ab3f3);
    --ok: #3fbf6f;
    --err: #e8484f;
    --pending: #d9a441;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    --r: 12px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }

  .avatar {
    width: 44px; height: 44px; flex: none;
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent); color: var(--on-accent);
    font-weight: 600; font-size: 17px;
  }

  h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .sub { margin: 2px 0 0; color: var(--hint); font-size: 13px; }

  /* Imzo element: tekshiruv daftari — server nima qilganini qadamma-qadam ko'rsatadi */
  .ledger {
    background: var(--surface);
    border-radius: var(--r);
    padding: 14px;
    margin-bottom: 16px;
    font-family: var(--mono);
    font-size: 12.5px;
  }

  .ledger-title {
    display: flex; justify-content: space-between; align-items: center;
    color: var(--hint); text-transform: uppercase;
    font-size: 10.5px; letter-spacing: 0.08em;
    margin-bottom: 10px;
  }

  .badge { padding: 2px 8px; border-radius: 20px; font-size: 10.5px; letter-spacing: 0.04em; }
  .badge[data-state="pending"] { background: color-mix(in srgb, var(--pending) 18%, transparent); color: var(--pending); }
  .badge[data-state="ok"]      { background: color-mix(in srgb, var(--ok) 18%, transparent);      color: var(--ok); }
  .badge[data-state="err"]     { background: color-mix(in srgb, var(--err) 18%, transparent);     color: var(--err); }

  .step {
    display: grid; grid-template-columns: 14px 1fr auto;
    gap: 8px; align-items: baseline;
    padding: 5px 0;
    border-top: 1px solid color-mix(in srgb, var(--hint) 18%, transparent);
    animation: in .28s ease both;
  }
  .step:first-of-type { border-top: 0; }
  .step .mark { color: var(--hint); }
  .step[data-state="ok"]  .mark { color: var(--ok); }
  .step[data-state="err"] .mark { color: var(--err); }
  .step .t { color: var(--hint); font-size: 11px; }
  .step .msg { word-break: break-word; }

  @keyframes in { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .step { animation: none; } }

  .card { background: var(--surface); border-radius: var(--r); padding: 4px 14px; margin-bottom: 16px; }

  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 0;
    border-top: 1px solid color-mix(in srgb, var(--hint) 15%, transparent);
  }
  .row:first-child { border-top: 0; }
  .row .label { color: var(--hint); font-size: 13px; }
  .row .value { font-family: var(--mono); font-size: 13px; text-align: right; word-break: break-all; }

  button {
    font: inherit; font-size: 14px; font-weight: 500;
    padding: 11px 14px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--on-accent);
    cursor: pointer; width: 100%;
  }
  button.ghost { background: color-mix(in srgb, var(--hint) 16%, transparent); color: var(--fg); }
  button:active { opacity: .75; }
  button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }

  .actions { display: grid; gap: 8px; }

  input {
    font: inherit; width: 100%;
    padding: 11px 12px; border-radius: 10px;
    border: 1px solid color-mix(in srgb, var(--hint) 30%, transparent);
    background: var(--bg); color: var(--fg);
  }
  input:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }

  footer { color: var(--hint); font-size: 11.5px; text-align: center; margin-top: 20px; }
  code { font-family: var(--mono); }
</style>
</head>
<body>

<header>
  <div class="avatar" id="avatar">?</div>
  <div>
    <h1 id="name">Tekshirilmoqda…</h1>
    <p class="sub" id="sub">initData serverga yuborilmoqda</p>
  </div>
</header>

<!-- Imzo element: nima sodir bo'layotgani yashirin emas -->
<section class="ledger" aria-live="polite">
  <div class="ledger-title">
    <span>Tekshiruv daftari</span>
    <span class="badge" id="badge" data-state="pending">kutilmoqda</span>
  </div>
  <div id="steps"></div>
</section>

<section class="card" id="profile" hidden>
  <div class="row"><span class="label">ID</span><span class="value" id="f-id">—</span></div>
  <div class="row"><span class="label">Username</span><span class="value" id="f-username">—</span></div>
  <div class="row"><span class="label">Premium</span><span class="value" id="f-premium">—</span></div>
  <div class="row"><span class="label">start_param</span><span class="value" id="f-start">—</span></div>
  <div class="row"><span class="label">Bosishlar</span><span class="value" id="f-clicks">0</span></div>
</section>

<section class="actions">
  <button id="btn-click">Serverda hisoblash</button>
  <input id="msg" placeholder="Botga yuboriladigan matn" maxlength="200" autocomplete="off">
  <button id="btn-notify" class="ghost">Botga xabar yuborish</button>
  <button id="btn-close" class="ghost">Ilovani yopish</button>
</section>

<footer>Zafather · initData har so'rovda qayta tekshiriladi</footer>

<script>
(function () {
  "use strict";
  var tg = window.Telegram && window.Telegram.WebApp;

  if (!tg || !tg.initData) {
    document.getElementById("name").textContent = "Telegram ichida oching";
    document.getElementById("sub").textContent = "Bu sahifa Mini App sifatida ishlaydi";
    step("err", "initData topilmadi — sahifa oddiy brauzerda ochilgan");
    setBadge("err", "mavjud emas");
    return;
  }

  tg.ready();
  tg.expand();

  var els = {
    steps: document.getElementById("steps"),
    badge: document.getElementById("badge"),
    name: document.getElementById("name"),
    sub: document.getElementById("sub"),
    avatar: document.getElementById("avatar"),
    profile: document.getElementById("profile")
  };

  function setBadge(state, text) {
    els.badge.dataset.state = state;
    els.badge.textContent = text;
  }

  function step(state, message) {
    var marks = { ok: "✓", err: "✗", pending: "·" };
    var el = document.createElement("div");
    el.className = "step";
    el.dataset.state = state;
    el.innerHTML =
      '<span class="mark">' + (marks[state] || "·") + "</span>" +
      '<span class="msg"></span>' +
      '<span class="t">' + new Date().toLocaleTimeString("uz-UZ") + "</span>";
    el.querySelector(".msg").textContent = message;
    els.steps.appendChild(el);
  }

  function haptic(type) {
    try { tg.HapticFeedback.notificationOccurred(type); } catch (e) {}
  }

  /* Har bir so'rovda initData sarlavhada ketadi — server uni HMAC bilan tekshiradi */
  function api(path, body) {
    return fetch("/api" + path, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Telegram-Init-Data": tg.initData
      },
      body: JSON.stringify(body || {})
    }).then(function (r) {
      return r.json().then(function (data) {
        if (!r.ok || !data.ok) throw new Error(data.error || "so'rov rad etildi (" + r.status + ")");
        return data;
      });
    });
  }

  function setText(id, value) {
    document.getElementById(id).textContent = (value === null || value === undefined || value === "") ? "—" : String(value);
  }

  /* 1-qadam: kim ekanligimizni serverdan so'raymiz */
  step("pending", "initData yuborildi (" + tg.initData.length + " bayt)");

  api("/me")
    .then(function (me) {
      step("ok", "hash to'g'ri — foydalanuvchi " + me.id);
      step("ok", "auth_date yangi, muddat ichida");
      setBadge("ok", "ishonchli");

      els.name.textContent = me.name;
      els.sub.textContent = me.username ? "@" + me.username : "username yo'q";
      els.avatar.textContent = (me.name || "?").trim().charAt(0).toUpperCase();
      els.profile.hidden = false;

      setText("f-id", me.id);
      setText("f-username", me.username ? "@" + me.username : null);
      setText("f-premium", me.is_premium ? "ha" : "yo'q");
      setText("f-start", me.start_param);
      haptic("success");
    })
    .catch(function (err) {
      step("err", err.message);
      setBadge("err", "rad etildi");
      els.name.textContent = "Tekshiruvdan o'tmadi";
      els.sub.textContent = "Server ma'lumotga ishonmadi";
      haptic("error");
    });

  /* Server holatini o'zgartirish */
  document.getElementById("btn-click").addEventListener("click", function () {
    var btn = this;
    btn.disabled = true;
    api("/click")
      .then(function (res) {
        setText("f-clicks", res.clicks);
        step("ok", "hisoblagich: " + res.clicks);
        try { tg.HapticFeedback.impactOccurred("light"); } catch (e) {}
      })
      .catch(function (err) { step("err", err.message); haptic("error"); })
      .finally(function () { btn.disabled = false; });
  });

  /* Ilovadan botga xabar */
  document.getElementById("btn-notify").addEventListener("click", function () {
    var input = document.getElementById("msg");
    var btn = this;
    btn.disabled = true;
    api("/notify", { text: input.value })
      .then(function () {
        step("ok", "bot chatga xabar yubordi");
        input.value = "";
        haptic("success");
      })
      .catch(function (err) { step("err", err.message); haptic("error"); })
      .finally(function () { btn.disabled = false; });
  });

  document.getElementById("btn-close").addEventListener("click", function () { tg.close(); });

  /* Pastdagi asosiy tugma — Telegram'ning o'z tugmasi */
  if (tg.MainButton) {
    tg.MainButton.setText("Yopish").show();
    tg.MainButton.onClick(function () { tg.close(); });
  }

  tg.onEvent("themeChanged", function () { step("pending", "tema o'zgardi — ranglar yangilandi"); });
})();
</script>
</body>
</html>
